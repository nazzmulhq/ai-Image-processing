[project]
name = "ai-image-processing"
version = "0.1.0"
description = "Stateless AI image processing API (FastAPI + Pillow + Google Gemini) with a built-in web UI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
    "google-genai~=2.31",
    "anyio>=4.6",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "fastapi-cli[standard]>=0.0.5",  # lets `uv run fastapi dev` work
    "ruff>=0.8",
    "locust>=2.32",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = [
    "S101",   # assert guards internal invariants
    "B008",   # FastAPI Depends()/Form() in defaults
    "RUF012", # mutable class attrs used by Pydantic
]

[tool.ruff.lint.per-file-ignores]
"loadtest/**" = ["S"]
"scripts/**" = ["S"]
